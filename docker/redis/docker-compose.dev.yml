# docker-compose.dev.yml — DEVELOPMENT
#
# Subir:  docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
# Seed:   docker compose -f docker-compose.yml -f docker-compose.dev.yml exec app npm run seed
# Shell:  docker compose -f docker-compose.yml -f docker-compose.dev.yml exec app sh
# ─────────────────────────────────────────────────────────────
version: "3.8"

services:
  redis:
    ports:
      - "6379:6379" # expõe localmente para usar clientes como RedisInsight
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

