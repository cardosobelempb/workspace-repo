# ─────────────────────────────────────────────────────────────
# docker-compose.yml — BASE (compartilhado por todos os envs)
# Uso: nunca rode diretamente, sempre com um override:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up
# ─────────────────────────────────────────────────────────────
version: "3.8"

services:
  redis:
    image: redis:latest
    container_name: redis_${APP_ENV:-dev}
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --port
      - "6379"
      - --requirepass
      - "${REDIS_PASSWORD}"
    volumes:
      - redis_data:/data
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # app:
