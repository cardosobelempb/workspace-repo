# ─────────────────────────────────────────────────────────────
# docker-compose.prod.yml — PRODUCTION
#
# Subir:    docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
# Migrate:  docker compose -f docker-compose.yml -f docker-compose.prod.yml exec app npx prisma migrate deploy
# Seed:     docker compose -f docker-compose.yml -f docker-compose.prod.yml exec app npm run seed
# Logs:     docker compose -f docker-compose.yml -f docker-compose.prod.yml logs -f app
# Backup:   docker compose -f docker-compose.yml -f docker-compose.prod.yml exec postgres \
#             pg_dump -U $POSTGRES_USER $POSTGRES_DB > backup.sql
# ─────────────────────────────────────────────────────────────
version: '3.8'

services:

  postgres:
    restart: always
    ports: []                             # nunca expõe em produção
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager          # mantém o dado sempre no mesmo nó
      resources:
        limits:
          cpus: "0.5"
          memory: 1024M
    # Logs estruturados
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  app:
    build:
      target: production                  # stage "production" do Dockerfile
    restart: always
    ports:
      - "3000:3000"
    volumes: []                           # sem bind-mount em produção
    command: node src/index.js
    environment:
      NODE_ENV: production
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 2048M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
