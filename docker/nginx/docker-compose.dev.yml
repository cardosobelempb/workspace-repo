# ─────────────────────────────────────────────────────────────
# docker-compose.dev.yml — DEVELOPMENT
#
# Subir:  docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
# Reload: docker compose -f docker-compose.yml -f docker-compose.dev.yml exec nginx nginx -s reload
# Teste config: docker compose -f docker-compose.yml -f docker-compose.dev.yml exec nginx nginx -t
# ─────────────────────────────────────────────────────────────
version: '3.8'

services:

  nginx:
    build:
      target: development
    ports:
      - "80:80"               # HTTP apenas em dev
    volumes:
      # Hot-reload das configs nginx sem rebuild
      - ./nginx/conf.d/dev.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/logs:/var/log/nginx
    environment:
      NGINX_HOST: localhost
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M

  app:
    build:
      target: development
    ports:
      - "3000:3000"           # expõe direto para debug fora do nginx
      - "9229:9229"           # debug Node.js
    volumes:
      - .:/app
      - /app/node_modules
    command: npm run dev
    environment:
      NODE_ENV: development
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1024M
