# ─────────────────────────────────────────────────────────────
# docker-compose.prod.yml — PRODUCTION
#
# Subir:        docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
# Reload nginx: docker compose -f docker-compose.yml -f docker-compose.prod.yml exec nginx nginx -s reload
# Testar SSL:   docker compose -f docker-compose.yml -f docker-compose.prod.yml exec nginx nginx -t
# Logs:         docker compose -f docker-compose.yml -f docker-compose.prod.yml logs -f nginx
#
# Certificados SSL:
#   Coloque fullchain.pem e privkey.pem em ./nginx/ssl/ antes de subir.
#   Ou use o Certbot — veja o serviço certbot abaixo.
# ─────────────────────────────────────────────────────────────
version: '3.8'

services:

  nginx:
    build:
      target: production
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Configs (somente leitura)
      - ./nginx/conf.d/prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
      # Certificados SSL
      - ./nginx/ssl:/etc/nginx/ssl:ro
      # Logs persistentes
      - nginx_logs:/var/log/nginx
      # Certbot webroot (renovação automática)
      - certbot_www:/var/www/certbot:ro
    environment:
      NGINX_HOST: ${NGINX_HOST}
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  app:
    build:
      target: production
    restart: always
    ports: []                 # não expõe — tráfego passa pelo nginx
    volumes: []
    command: node src/index.js
    environment:
      NODE_ENV: production
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 2048M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  # ── Certbot: renovação automática de SSL (Let's Encrypt) ──
  certbot:
    image: certbot/certbot:latest
    container_name: certbot
    volumes:
      - ./nginx/ssl:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    # Renova e recarrega nginx a cada 12h
    entrypoint: >
      sh -c "trap exit TERM;
             while :; do
               certbot renew --webroot -w /var/www/certbot --quiet;
               sleep 12h & wait $${!};
             done"
    networks:
      - app_network

volumes:
  nginx_logs:
  certbot_www:

networks:
  app_network:
    driver: bridge
