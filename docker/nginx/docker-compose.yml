# ─────────────────────────────────────────────────────────────
# docker-compose.yml — BASE
# Nunca rode diretamente. Use sempre com um override:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up
# ─────────────────────────────────────────────────────────────
version: '3.8'

services:

  nginx:
    build:
      context: .
      dockerfile: Dockerfile.nginx
    container_name: nginx_${APP_ENV:-dev}
    restart: unless-stopped
    networks:
      - app_network
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/nginx-health"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: app_${APP_ENV:-dev}
    env_file:
      - .env.${APP_ENV:-dev}
    environment:
      NODE_ENV: ${APP_ENV:-development}
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    stdin_open: true
    tty: true

networks:
  app_network:
    driver: bridge
