# nginx/nginx.prod.conf — configuração global de produção
# Tuning de workers e conexões para alta disponibilidade

user  nginx;

# Um worker por CPU — deixa "auto" e o nginx detecta
worker_processes auto;

error_log /var/log/nginx/error.log warn;
pid       /var/run/nginx.pid;

events {
    worker_connections 1024;
    use                epoll;       # melhor performance no Linux
    multi_accept       on;
}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent"';

    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65;
    types_hash_max_size 2048;

    # Limita tamanho do body (proteção contra uploads maliciosos)
    client_max_body_size 20M;

    include /etc/nginx/conf.d/*.conf;
}
