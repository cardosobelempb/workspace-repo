services:
  backend-test:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile.dev
    container_name: backend-test
    env_file:
      - .env.test
    command: sh -c "cd apps/backend && pnpm test"
    depends_on:
      - postgres-test

  postgres-test:
    image: postgres:16-alpine
    container_name: postgres-test
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: app_test
